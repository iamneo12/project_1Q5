services:
  - name: telegram-data-agent
    type: web
    env: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT

    envVars:
      # LLM provider
      - key: LLM_MODEL
        value: gpt-4o
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1

      # hybrid deadline tuning (step cap + phase split + time bank; see bot.py)
      - key: MAX_AGENT_STEPS
        value: "12"
      - key: QUESTION_BUDGET_SECONDS
        value: "210"

      # secrets - set manually in the Render dashboard, not committed
      - key: LLM_API_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BASE_URL
        sync: false